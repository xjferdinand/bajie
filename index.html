<script>
const HISTORY_KEY   = 'xiaolaohu_5131861_ab_v11_pair_break';
const HISTORY_LIMIT = 30;

const roomEl     = document.getElementById('room');
const goEl       = document.getElementById('go');
const msgEl      = document.getElementById('msg');
const resultEl   = document.getElementById('result');
const resultHdr  = document.getElementById('resultHdr');
const hitListEl  = document.getElementById('hitList');
const skipEl     = document.getElementById('skip');
const histListEl = document.getElementById('histList');
const clearBtnEl = document.getElementById('clearBtn');

function getDigits(room){
  return room.split('').map(Number);
}

function getParityPattern(room){
  return room
    .split('')
    .map(n => (parseInt(n, 10) % 2 === 0 ? '偶' : '奇'))
    .join('');
}

function getSeatIndex(seat){
  if(seat === 1) return 0;
  if(seat === 2) return 1;
  if(seat === 3) return 2;
  if(seat === 4) return 3;
  if(seat === 5 || seat === 6) return 4;
  return null;
}

function getSeatX(room, seat){
  const digits = getDigits(room);
  return digits[getSeatIndex(seat)];
}

function getUniqueRanks(room){
  const digits = getDigits(room);

  const order = digits.map((v,i)=>({v,i}))
    .sort((a,b)=>{
      if(b.v !== a.v) return b.v - a.v;
      return a.i - b.i;
    });

  const ranks = Array(5);
  order.forEach((item, idx) => {
    ranks[item.i] = idx + 1;
  });

  return ranks;
}

function getSeatRank(room, seat){
  const ranks = getUniqueRanks(room);
  return ranks[getSeatIndex(seat)];
}

function isSameParity(seat, x){
  return (seat % 2) === (x % 2);
}

function countMap(arr){
  const m = {};
  arr.forEach(n => m[n] = (m[n] || 0) + 1);
  return m;
}

function getRepeatInfo(room){
  const digits = getDigits(room);
  const counts = countMap(digits);

  const groups = Object.entries(counts)
    .map(([num,cnt])=>({num:Number(num), cnt}))
    .filter(g=>g.cnt > 1)
    .sort((a,b)=>b.cnt - a.cnt || b.num - a.num);

  if(groups.length === 0){
    return {
      kind:'无重号',
      short:'无重',
      groups,
      hasRepeat:false
    };
  }

  const cnts = groups.map(g=>g.cnt).sort((a,b)=>b-a).join(',');

  let kind = '重号';
  let short = '重号';

  if(cnts === '2'){
    kind = '单数字双重号';
    short = '单对子';
  }else if(cnts === '3'){
    kind = '单数字三重号';
    short = '三重号';
  }else if(cnts === '4'){
    kind = '单数字四重号';
    short = '四重号';
  }else if(cnts === '5'){
    kind = '五重号';
    short = '五重号';
  }else if(cnts === '2,2'){
    kind = '两个数字同时双重';
    short = '双对子';
  }else if(cnts === '3,2'){
    kind = '三重号+双重号';
    short = '三带二';
  }

  return {
    kind,
    short,
    groups,
    hasRepeat:true
  };
}

function repeatNumsText(info){
  if(!info.groups.length) return '无';
  return info.groups.map(g => `${g.num}×${g.cnt}`).join(' / ');
}

function getXCount(room, seat){
  const digits = getDigits(room);
  const x = getSeatX(room, seat);
  const counts = countMap(digits);
  return counts[x] || 0;
}

function xEatRepeat(room, seat){
  return getXCount(room, seat) > 1;
}

function xEatPair(room, seat){
  return getXCount(room, seat) === 2;
}

function baseRule(room, seat, xRank, sameParity){
  const eatsPair = xEatPair(room, seat);

  if(seat === 1){
    return { grade:99, tag:'跳', score:-99, reason:'1号位固定跳' };
  }

  /*
    最新特权：
    3号位、4号位，X吃对子时，可以破奇偶。
    但必须继续满足X排名要求。
  */

  if(seat === 3 && eatsPair){
    if(xRank === 1) return { grade:1, tag:'A档', score:108, reason:'3号位X吃对子+第1名，破奇偶A档' };
    if(xRank === 2) return { grade:1, tag:'A档', score:104, reason:'3号位X吃对子+第2名，破奇偶A档' };
  }

  if(seat === 4 && eatsPair){
    if(xRank === 5) return { grade:1, tag:'A档', score:106, reason:'4号位X吃对子+第5名，破奇偶A档' };
    if(xRank === 4) return { grade:2, tag:'B档', score:82, reason:'4号位X吃对子+第4名，破奇偶B档' };
    if(xRank === 2) return { grade:2, tag:'B档', score:78, reason:'4号位X吃对子+第2名，破奇偶B档' };
  }

  /*
    正常规则：
    没有特权时，必须奇偶同频。
  */

  if(!sameParity){
    return { grade:99, tag:'跳', score:-20, reason:'奇偶不同频，且未触发对子特权' };
  }

  if(seat === 2){
    if(xRank === 5) return { grade:1, tag:'A档', score:95, reason:'2号位同频+X第5名' };
    if(xRank === 1) return { grade:2, tag:'B档', score:75, reason:'2号位同频+X第1名' };
    return { grade:99, tag:'跳', score:-30, reason:'2号位未命中A/B排名' };
  }

  if(seat === 3){
    if(xRank === 1) return { grade:1, tag:'A档', score:96, reason:'3号位同频+X第1名' };
    if(xRank === 2) return { grade:1, tag:'A档', score:90, reason:'3号位同频+X第2名' };
    if(xRank === 4) return { grade:2, tag:'B档', score:72, reason:'3号位同频+X第4名' };
    return { grade:99, tag:'跳', score:-30, reason:'3号位未命中A/B排名' };
  }

  if(seat === 4){
    if(xRank === 5) return { grade:1, tag:'A档', score:92, reason:'4号位同频+X第5名' };
    if(xRank === 4) return { grade:2, tag:'B档', score:65, reason:'4号位同频+X第4名' };
    if(xRank === 2) return { grade:2, tag:'B档', score:60, reason:'4号位同频+X第2名' };
    return { grade:99, tag:'跳', score:-25, reason:'4号位未命中A/B排名' };
  }

  if(seat === 5){
    return { grade:99, tag:'跳', score:-55, reason:'5号位整体弱，稳健版不打' };
  }

  if(seat === 6){
    if(xRank === 4) return { grade:1, tag:'A档', score:92, reason:'6号位同频+X第4名' };
    if(xRank === 1) return { grade:2, tag:'B档', score:70, reason:'6号位同频+X第1名' };
    return { grade:99, tag:'跳', score:-30, reason:'6号位未命中A/B排名' };
  }

  return { grade:99, tag:'跳', score:-99, reason:'无规则' };
}

function applyRepeatAdjust(room, seat, decision){
  const info = getRepeatInfo(room);
  const eat = xEatRepeat(room, seat);
  const eatsPair = xEatPair(room, seat);
  const notes = [];

  let grade = decision.grade;
  let score = decision.score;
  let tag = decision.tag;

  if(!info.hasRepeat){
    notes.push('无重号');
    return { grade, score, tag, repeatNote: notes.join('；'), eat, eatsPair, repeatInfo: info };
  }

  if(eat){
    score += 10;
    notes.push(`X吃重号：${repeatNumsText(info)}`);

    if(eatsPair){
      score += 8;
      notes.push('X吃对子，加分');
    }

    if(info.short === '三重号'){
      score += 5;
      notes.push('三重号偏友好');
    }

    if(info.short === '四重号'){
      score += 5;
      notes.push('四重号吃到，加分');
    }
  }else{
    notes.push(`X未吃重号：${repeatNumsText(info)}`);

    if(info.short === '单对子'){
      score -= 18;
      if(grade < 3) grade += 1;
      notes.push('单对子未吃，降级');
    }

    if(info.short === '四重号'){
      score -= 15;
      if(grade < 3) grade += 1;
      notes.push('四重号未吃，降级');
    }

    if(info.short === '三带二'){
      score -= 40;
      grade = 99;
      tag = '跳';
      notes.push('三带二未吃，跳');
    }
  }

  /*
    双对子保护：
    历史里3号位遇双对子偏雷，继续拦截。
    4号位遇双对子加分。
  */

  if(info.short === '双对子'){
    if(seat === 3){
      score -= 50;
      grade = 99;
      tag = '跳';
      notes.push('双对子里3号位偏雷，跳');
    }else if(seat === 4 && decision.grade < 99){
      score += 12;
      notes.push('双对子里4号位加分');
    }else if(seat === 6 && decision.grade < 99){
      score += 3;
      notes.push('双对子里6号位短打');
    }else{
      score -= 8;
      notes.push('双对子高波动');
    }
  }

  if(grade === 1) tag = 'A档';
  else if(grade === 2) tag = 'B档';
  else tag = '跳';

  return { grade, score, tag, repeatNote: notes.join('；'), eat, eatsPair, repeatInfo: info };
}

function analyzeSeat(room, seat){
  const x = getSeatX(room, seat);
  const xRank = getSeatRank(room, seat);
  const sameParity = isSameParity(seat, x);
  const base = baseRule(room, seat, xRank, sameParity);
  const adjusted = applyRepeatAdjust(room, seat, base);

  return {
    seat,
    x,
    xRank,
    sameParity,
    grade: adjusted.grade,
    score: adjusted.score,
    tag: adjusted.tag,
    reason: base.reason,
    repeatNote: adjusted.repeatNote,
    repeatInfo: adjusted.repeatInfo,
    eatRepeat: adjusted.eat,
    eatsPair: adjusted.eatsPair
  };
}

function analyzeRoom(room){
  const seats = [1,2,3,4,5,6].map(seat => analyzeSeat(room, seat));

  const usable = seats
    .filter(s => s.grade === 1 || s.grade === 2)
    .sort((a,b) => {
      if(a.grade !== b.grade) return a.grade - b.grade;
      return b.score - a.score;
    });

  return { seats, usable };
}

function rankClass(item){
  if(item.grade === 1) return 'r1';
  if(item.grade === 2) return 'r2';
  return '';
}

function buildCard(item){
  const div = document.createElement('div');
  div.className = `hit ${rankClass(item)}`;

  const parityText = item.sameParity ? '同频' : '破奇偶';
  const eatText = item.eatRepeat ? (item.eatsPair ? '吃对子' : '吃重号') : (item.repeatInfo.hasRepeat ? '未吃重号' : '无重号');
  const rightTop = item.grade === 1 ? '优先' : '短打';
  const rightBottom = `分${item.score}`;

  div.innerHTML = `
    <div class="hit-lbl">${item.tag}</div>
    <div class="hit-seat">${item.seat}号</div>
    <div class="hit-body">
      <div class="row1">X=${item.x}　第${item.xRank}名　${parityText}</div>
      <div class="row2">${item.repeatInfo.short}｜${eatText}</div>
      <div class="row3">${item.reason}；${item.repeatNote}</div>
    </div>
    <div class="hit-right">
      <div class="hit-wr">${rightTop}</div>
      <div class="hit-avg">${rightBottom}</div>
    </div>
  `;
  return div;
}

function formatDigitRank(room){
  const digits = getDigits(room);
  const ranks = getUniqueRanks(room);
  const labels = ['A','B','C','D','E'];
  return digits.map((d,i)=>`${labels[i]}${d}=第${ranks[i]}`).join('　');
}

function render(room){
  const analysis = analyzeRoom(room);
  const repeatInfo = getRepeatInfo(room);

  resultEl.style.display = 'none';
  skipEl.style.display = 'none';
  hitListEl.innerHTML = '';

  const pattern = getParityPattern(room);
  const rankText = formatDigitRank(room);
  const repeatText = `${repeatInfo.kind}${repeatInfo.hasRepeat ? '｜' + repeatNumsText(repeatInfo) : ''}`;

  resultHdr.innerHTML = `${pattern}｜${repeatText}<br>${rankText}`;

  if(!analysis.usable.length){
    skipEl.style.display = 'block';
    resultEl.style.display = 'none';
    return [];
  }

  analysis.usable.slice(0,4).forEach(item => {
    hitListEl.appendChild(buildCard(item));
  });

  resultEl.style.display = 'block';

  return analysis.usable.map(s => s.seat).slice(0,4);
}

function run(){
  const raw = roomEl.value.trim().replace(/\s+/g, '');
  if(!/^\d{5}$/.test(raw)){
    msgEl.textContent = '请输入正确的5位数字';
    return;
  }

  msgEl.textContent = '';
  const seats = render(raw);
  pushHistory(raw, seats);
  setTimeout(() => { roomEl.value = ''; roomEl.focus(); }, 180);
}

function loadHist(){
  try{
    return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
  }catch{
    return [];
  }
}

function saveHist(items){
  localStorage.setItem(HISTORY_KEY, JSON.stringify(items.slice(0, HISTORY_LIMIT)));
}

function renderHist(){
  const items = loadHist();
  histListEl.innerHTML = '';

  if(!items.length){
    histListEl.innerHTML = `<div class="histItem"><div class="histMain" style="color:rgba(255,255,255,.2)">暂无记录</div></div>`;
    return;
  }

  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'histItem';
    const res = item.seats.length ? item.seats.map(s=>`${s}号`).join(' / ') : '跳';
    div.innerHTML = `
      <div class="histTop"><span>房号 <span class="pill">${item.room}</span></span><span>${item.time}</span></div>
      <div class="histMain">${item.pattern} → ${res}</div>
    `;
    histListEl.appendChild(div);
  });
}

function pushHistory(room, seats){
  const items = loadHist();
  items.unshift({
    room,
    seats,
    pattern: getParityPattern(room),
    time: new Date().toLocaleString('zh-CN', {hour12:false})
  });
  saveHist(items);
  renderHist();
}

goEl.addEventListener('click', run);
roomEl.addEventListener('keydown', e => { if(e.key === 'Enter') run(); });

clearBtnEl.addEventListener('click', () => {
  localStorage.removeItem(HISTORY_KEY);
  renderHist();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}

renderHist();
roomEl.focus();
</script>
