<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#b00000"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="小老虎模型">
  <title>小老虎模型</title>
  <style>
    :root{
      --bg:#0b0b0f;
      --card:#11111a;
      --line:rgba(255,255,255,.10);
      --text:#f5f5f7;
      --muted:rgba(255,255,255,.50);
      --red:#ff2d2d;
      --green:rgba(80,255,140,.85);
      --orange:#ff9f2d;
    }
    *{box-sizing:border-box;margin:0;padding:0;}

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:
        radial-gradient(800px 400px at 50% 15%,rgba(255,45,45,.20),transparent 60%),
        radial-gradient(900px 500px at 50% 110%,rgba(176,0,0,.25),transparent 60%),
        var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
      padding:12px;
    }

    .app{width:min(430px,100%);}

    .title{
      font-size:16px;
      font-weight:900;
      margin:0 0 12px;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .title::before{
      content:"";
      flex-shrink:0;
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--red);
      box-shadow:0 0 12px rgba(255,45,45,.9);
    }
    .version{
      font-size:10px;
      color:rgba(255,45,45,.6);
      margin-left:4px;
      font-weight:400;
    }

    .panel{
      background:linear-gradient(160deg,rgba(255,45,45,.07),transparent 55%),var(--card);
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      box-shadow:0 20px 60px rgba(0,0,0,.55);
    }

    input{
      width:100%;
      padding:12px 14px;
      font-size:22px;
      letter-spacing:5px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.40);
      color:var(--text);
      outline:none;
      text-align:center;
      font-weight:700;
    }
    input:focus{
      border-color:rgba(255,45,45,.65);
      box-shadow:0 0 0 3px rgba(255,45,45,.12);
    }
    input::placeholder{
      font-size:13px;
      letter-spacing:1px;
      font-weight:400;
    }

    .btn-wrap{
      display:flex;
      justify-content:center;
      margin:14px 0 8px;
    }
    .btn-circle{
      width:66px;
      height:66px;
      border-radius:50%;
      border:2px solid rgba(255,45,45,.55);
      background:radial-gradient(circle at 38% 32%,rgba(255,90,90,.95),rgba(155,0,0,.95));
      color:#fff;
      font-size:15px;
      font-weight:900;
      letter-spacing:1px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow:0 0 18px rgba(255,45,45,.40),inset 0 1px 0 rgba(255,255,255,.18);
      transition:transform .1s,box-shadow .1s;
    }
    .btn-circle:active{transform:scale(.92);}

    .msg{
      text-align:center;
      font-size:12px;
      color:var(--muted);
      min-height:14px;
      margin-bottom:8px;
    }

    .result{
      display:none;
      margin-top:4px;
    }
    .result-hdr{
      text-align:center;
      font-size:10px;
      color:var(--muted);
      margin-bottom:8px;
      letter-spacing:.3px;
      line-height:1.45;
    }
    .hit-list{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .hit{
      display:grid;
      grid-template-columns:auto 52px 1fr auto;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.07);
      background:rgba(0,0,0,.22);
    }
    .hit.r1{border-color:rgba(255,45,45,.50);background:rgba(255,45,45,.10);}
    .hit.r2{border-color:rgba(255,140,0,.32);background:rgba(255,140,0,.06);}

    .hit-lbl{
      font-size:9px;
      font-weight:900;
      padding:2px 6px;
      border-radius:999px;
      background:rgba(255,45,45,.20);
      color:#ff8080;
      white-space:nowrap;
      letter-spacing:.2px;
    }
    .hit.r1 .hit-lbl{
      background:rgba(255,45,45,.38);
      color:#ff9090;
    }
    .hit.r2 .hit-lbl{
      background:rgba(255,140,0,.20);
      color:#ffc080;
    }

    .hit-seat{
      font-size:21px;
      font-weight:1000;
      color:var(--red);
      text-shadow:0 0 12px rgba(255,45,45,.35);
      line-height:1.05;
      text-align:center;
      white-space:nowrap;
    }

    .hit-body{
      line-height:1.4;
      min-width:0;
    }
    .hit-body .row1{
      font-size:11px;
      color:var(--text);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .hit-body .row2{
      font-size:10px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .hit-body .row3{
      font-size:9px;
      color:rgba(255,255,255,.32);
      margin-top:1px;
      line-height:1.25;
    }

    .hit-right{
      text-align:right;
      min-width:42px;
    }
    .hit-wr{
      font-size:11px;
      font-weight:900;
      color:var(--green);
    }
    .hit-avg{
      font-size:9px;
      color:rgba(255,255,255,.35);
      margin-top:1px;
    }

    .skip{
      display:none;
      text-align:center;
      padding:18px;
      font-size:30px;
      font-weight:1000;
      color:rgba(255,255,255,.18);
      letter-spacing:4px;
    }

    .history{
      margin-top:12px;
      padding:10px 11px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.02);
    }
    .histHead{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:7px;
    }
    .histTitle{
      font-size:11px;
      font-weight:800;
      color:var(--muted);
    }
    .clearBtn{
      font-size:10px;
      padding:4px 8px;
      border-radius:7px;
      cursor:pointer;
      border:1px solid rgba(255,45,45,.35);
      background:rgba(255,45,45,.10);
      color:rgba(255,100,100,.85);
    }
    .histList{
      display:flex;
      flex-direction:column;
      gap:5px;
      max-height:180px;
      overflow:auto;
    }
    .histItem{
      border:1px solid rgba(255,255,255,.05);
      border-radius:9px;
      padding:7px 9px;
      background:rgba(0,0,0,.14);
    }
    .histTop{
      display:flex;
      justify-content:space-between;
      font-size:10px;
      color:rgba(255,255,255,.35);
      margin-bottom:2px;
    }
    .histMain{
      font-size:11px;
      color:rgba(255,255,255,.60);
      line-height:1.35;
    }
    .pill{
      display:inline-block;
      padding:1px 6px;
      border-radius:999px;
      border:1px solid rgba(255,45,45,.35);
      background:rgba(255,45,45,.10);
      font-weight:800;
      color:var(--red);
      margin-right:3px;
    }

    .tiny{
      margin-top:12px;
      padding-top:10px;
      border-top:1px solid var(--line);
      font-size:10px;
      color:rgba(255,255,255,.28);
      line-height:1.6;
      white-space:pre-line;
    }

    @media (max-width: 430px){
      body{padding:10px;}
      .app{width:100%;}
      .panel{padding:10px;border-radius:15px;}
      .hit{
        grid-template-columns:auto 46px 1fr auto;
        gap:6px;
        padding:7px 8px;
      }
      .hit-seat{font-size:19px;}
      .result-hdr{font-size:10px;}
      .histMain{font-size:10px;}
      .tiny{font-size:9px;}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="title">小老虎专属<span class="version">ID 5131861 / 稳健A+B版</span></div>
  <div class="panel">

    <input id="room" inputmode="numeric" placeholder="输入5位房号" maxlength="5"/>

    <div class="btn-wrap">
      <button class="btn-circle" id="go">开干</button>
    </div>

    <div class="msg" id="msg"></div>

    <div class="result" id="result">
      <div class="result-hdr" id="resultHdr">— 小老虎稳健结果 —</div>
      <div class="hit-list" id="hitList"></div>
    </div>
    <div class="skip" id="skip">无A/B，跳</div>

    <div class="history">
      <div class="histHead">
        <span class="histTitle">最近记录</span>
        <button class="clearBtn" id="clearBtn">清空</button>
      </div>
      <div class="histList" id="histList"></div>
    </div>

    <div class="tiny">
【小老虎 ID 5131861 稳健A+B版】
只显示 A档 / B档。
观察档、跳位、未命中位子一律不显示。
没有A/B命中，直接显示：无A/B，跳。

核心逻辑：
1）座位奇偶 = X奇偶
2）X在五位数字里的唯一排名
3）房号有重号时，看X是否吃到重号

A/B/C/D/E = 房号五位
1号=A，2号=B，3号=C，4号=D，5号=E，6号=E
第1名=最大，第5名=最小
重号不并列，按从左到右单独排序

稳健回测：
A+B：17局，胜率88.2%，净分+10180，0大输
    </div>

  </div>
</div>

<script>
const HISTORY_KEY   = 'xiaolaohu_5131861_ab_only_v1';
const HISTORY_LIMIT = 30;

const roomEl     = document.getElementById('room');
const goEl       = document.getElementById('go');
const msgEl      = document.getElementById('msg');
const resultEl   = document.getElementById('result');
const resultHdr  = document.getElementById('resultHdr');
const hitListEl  = document.getElementById('hitList');
const skipEl     = document.getElementById('skip');
const histListEl = document.getElementById('histList');
const clearBtnEl = document.getElementById('clearBtn');

function getDigits(room){
  return room.split('').map(Number);
}

function getParityPattern(room){
  return room
    .split('')
    .map(n => (parseInt(n, 10) % 2 === 0 ? '偶' : '奇'))
    .join('');
}

function getSeatIndex(seat){
  if(seat === 1) return 0;
  if(seat === 2) return 1;
  if(seat === 3) return 2;
  if(seat === 4) return 3;
  if(seat === 5 || seat === 6) return 4;
  return null;
}

function getSeatX(room, seat){
  const digits = getDigits(room);
  return digits[getSeatIndex(seat)];
}

function getUniqueRanks(room){
  const digits = getDigits(room);
  const order = digits.map((v,i)=>({v,i}))
    .sort((a,b)=>{
      if(b.v !== a.v) return b.v - a.v;
      return a.i - b.i;
    });

  const ranks = Array(5);
  order.forEach((item, idx) => {
    ranks[item.i] = idx + 1;
  });
  return ranks;
}

function getSeatRank(room, seat){
  const ranks = getUniqueRanks(room);
  return ranks[getSeatIndex(seat)];
}

function isSameParity(seat, x){
  return (seat % 2) === (x % 2);
}

function countMap(arr){
  const m = {};
  arr.forEach(n => m[n] = (m[n] || 0) + 1);
  return m;
}

function getRepeatInfo(room){
  const digits = getDigits(room);
  const counts = countMap(digits);
  const groups = Object.entries(counts)
    .map(([num,cnt])=>({num:Number(num), cnt}))
    .filter(g=>g.cnt > 1)
    .sort((a,b)=>b.cnt - a.cnt || b.num - a.num);

  if(groups.length === 0){
    return {
      kind:'无重号',
      short:'无重',
      groups,
      hasRepeat:false
    };
  }

  const cnts = groups.map(g=>g.cnt).sort((a,b)=>b-a).join(',');

  let kind = '重号';
  let short = '重号';

  if(cnts === '2'){
    kind = '单数字双重号';
    short = '单对子';
  }else if(cnts === '3'){
    kind = '单数字三重号';
    short = '三重号';
  }else if(cnts === '4'){
    kind = '单数字四重号';
    short = '四重号';
  }else if(cnts === '5'){
    kind = '五重号';
    short = '五重号';
  }else if(cnts === '2,2'){
    kind = '两个数字同时双重';
    short = '双对子';
  }else if(cnts === '3,2'){
    kind = '三重号+双重号';
    short = '三带二';
  }

  return {
    kind,
    short,
    groups,
    hasRepeat:true
  };
}

function repeatNumsText(info){
  if(!info.groups.length) return '无';
  return info.groups.map(g => `${g.num}×${g.cnt}`).join(' / ');
}

function xEatRepeat(room, seat){
  const digits = getDigits(room);
  const x = getSeatX(room, seat);
  const counts = countMap(digits);
  return counts[x] > 1;
}

function baseRule(seat, xRank, sameParity){
  if(seat === 1){
    return { grade:99, tag:'跳', score:-99, reason:'1号位固定跳' };
  }

  if(!sameParity){
    return { grade:99, tag:'跳', score:-20, reason:'奇偶不同频' };
  }

  if(seat === 2){
    if(xRank === 5) return { grade:1, tag:'A档', score:95, reason:'2号位最吃X第5名' };
    if(xRank === 1) return { grade:2, tag:'B档', score:75, reason:'2号位X第1名可短打' };
    if(xRank === 4) return { grade:3, tag:'观察', score:55, reason:'2号位X第4名观察' };
    if(xRank === 2) return { grade:99, tag:'跳', score:-80, reason:'2号位X第2名雷' };
    return { grade:99, tag:'跳', score:-30, reason:'2号位该排名无优势' };
  }

  if(seat === 3){
    if(xRank === 1) return { grade:1, tag:'A档', score:96, reason:'3号位吃X第1名' };
    if(xRank === 2) return { grade:1, tag:'A档', score:90, reason:'3号位吃X第2名' };
    if(xRank === 4) return { grade:2, tag:'B档', score:72, reason:'3号位X第4名可短打' };
    if(xRank === 5) return { grade:3, tag:'观察', score:45, reason:'3号位X第5名观察' };
    if(xRank === 3) return { grade:99, tag:'跳', score:-85, reason:'3号位X第3名雷' };
    return { grade:99, tag:'跳', score:-30, reason:'3号位该排名无优势' };
  }

  if(seat === 4){
    if(xRank === 5) return { grade:1, tag:'A档', score:92, reason:'4号位最吃X第5名' };
    if(xRank === 4) return { grade:2, tag:'B档', score:65, reason:'4号位X第4名短打' };
    if(xRank === 2) return { grade:2, tag:'B档', score:60, reason:'4号位X第2名短打' };
    if(xRank === 1) return { grade:99, tag:'跳', score:-75, reason:'4号位X第1名高危' };
    return { grade:99, tag:'跳', score:-25, reason:'4号位该排名无优势' };
  }

  if(seat === 5){
    if(xRank === 5) return { grade:3, tag:'观察', score:40, reason:'5号位仅观察' };
    return { grade:99, tag:'跳', score:-55, reason:'5号位整体弱' };
  }

  if(seat === 6){
    if(xRank === 4) return { grade:1, tag:'A档', score:92, reason:'6号位最吃X第4名' };
    if(xRank === 1) return { grade:2, tag:'B档', score:70, reason:'6号位X第1名短打' };
    if(xRank === 3) return { grade:3, tag:'观察', score:45, reason:'6号位X第3名观察' };
    if(xRank === 5) return { grade:3, tag:'观察', score:40, reason:'6号位X第5名观察' };
    if(xRank === 2) return { grade:99, tag:'跳', score:-80, reason:'6号位X第2名雷' };
    return { grade:99, tag:'跳', score:-30, reason:'6号位该排名无优势' };
  }

  return { grade:99, tag:'跳', score:-99, reason:'无规则' };
}

function applyRepeatAdjust(room, seat, decision){
  const info = getRepeatInfo(room);
  const eat = xEatRepeat(room, seat);
  const notes = [];

  let grade = decision.grade;
  let score = decision.score;
  let tag = decision.tag;

  if(!info.hasRepeat){
    notes.push('无重号');
    return { grade, score, tag, repeatNote: notes.join('；'), eat, repeatInfo: info };
  }

  if(eat){
    score += 10;
    notes.push(`X吃重号：${repeatNumsText(info)}`);

    if(info.short === '单对子'){
      notes.push('单对子吃到，加分');
    }
    if(info.short === '三重号'){
      score += 5;
      notes.push('三重号偏友好');
    }
    if(info.short === '四重号'){
      score += 5;
      notes.push('四重号吃到，加分');
    }
  }else{
    notes.push(`X未吃重号：${repeatNumsText(info)}`);

    if(info.short === '单对子'){
      score -= 18;
      if(grade < 3) grade += 1;
      notes.push('单对子未吃，降级');
    }

    if(info.short === '四重号'){
      score -= 15;
      if(grade < 3) grade += 1;
      notes.push('四重号未吃，降级');
    }

    if(info.short === '三带二'){
      score -= 40;
      grade = 99;
      tag = '跳';
      notes.push('三带二未吃，跳');
    }
  }

  if(info.short === '双对子'){
    if(seat === 4 && decision.grade < 99){
      score += 12;
      notes.push('双对子里4号位加分');
    }else if(seat === 6 && decision.grade < 99){
      score += 3;
      notes.push('双对子里6号位短打');
    }else if(seat === 3){
      score -= 50;
      grade = 99;
      tag = '跳';
      notes.push('双对子里3号位偏雷，跳');
    }else{
      score -= 8;
      notes.push('双对子高波动');
    }
  }

  if(grade === 1) tag = 'A档';
  else if(grade === 2) tag = 'B档';
  else if(grade === 3) tag = '观察';
  else tag = '跳';

  return { grade, score, tag, repeatNote: notes.join('；'), eat, repeatInfo: info };
}

function analyzeSeat(room, seat){
  const x = getSeatX(room, seat);
  const xRank = getSeatRank(room, seat);
  const sameParity = isSameParity(seat, x);
  const base = baseRule(seat, xRank, sameParity);
  const adjusted = applyRepeatAdjust(room, seat, base);

  return {
    seat,
    x,
    xRank,
    sameParity,
    grade: adjusted.grade,
    score: adjusted.score,
    tag: adjusted.tag,
    reason: base.reason,
    repeatNote: adjusted.repeatNote,
    repeatInfo: adjusted.repeatInfo,
    eatRepeat: adjusted.eat
  };
}

function analyzeRoom(room){
  const seats = [1,2,3,4,5,6].map(seat => analyzeSeat(room, seat));

  const usable = seats
    .filter(s => s.grade === 1 || s.grade === 2)
    .sort((a,b) => {
      if(a.grade !== b.grade) return a.grade - b.grade;
      return b.score - a.score;
    });

  return { seats, usable };
}

function rankClass(item){
  if(item.grade === 1) return 'r1';
  if(item.grade === 2) return 'r2';
  return '';
}

function buildCard(item){
  const div = document.createElement('div');
  div.className = `hit ${rankClass(item)}`;

  const parityText = item.sameParity ? '同频' : '不同频';
  const eatText = item.eatRepeat ? '吃重号' : (item.repeatInfo.hasRepeat ? '未吃重号' : '无重号');
  const rightTop = item.grade === 1 ? '优先' : '短打';
  const rightBottom = `分${item.score}`;

  div.innerHTML = `
    <div class="hit-lbl">${item.tag}</div>
    <div class="hit-seat">${item.seat}号</div>
    <div class="hit-body">
      <div class="row1">X=${item.x}　第${item.xRank}名　${parityText}</div>
      <div class="row2">${item.repeatInfo.short}｜${eatText}</div>
      <div class="row3">${item.reason}；${item.repeatNote}</div>
    </div>
    <div class="hit-right">
      <div class="hit-wr">${rightTop}</div>
      <div class="hit-avg">${rightBottom}</div>
    </div>
  `;
  return div;
}

function formatDigitRank(room){
  const digits = getDigits(room);
  const ranks = getUniqueRanks(room);
  const labels = ['A','B','C','D','E'];
  return digits.map((d,i)=>`${labels[i]}${d}=第${ranks[i]}`).join('　');
}

function render(room){
  const analysis = analyzeRoom(room);
  const repeatInfo = getRepeatInfo(room);

  resultEl.style.display = 'none';
  skipEl.style.display = 'none';
  hitListEl.innerHTML = '';

  const pattern = getParityPattern(room);
  const rankText = formatDigitRank(room);
  const repeatText = `${repeatInfo.kind}${repeatInfo.hasRepeat ? '｜' + repeatNumsText(repeatInfo) : ''}`;

  resultHdr.innerHTML = `${pattern}｜${repeatText}<br>${rankText}`;

  if(!analysis.usable.length){
    skipEl.style.display = 'block';
    resultEl.style.display = 'none';
    return [];
  }

  analysis.usable.slice(0,4).forEach(item => {
    hitListEl.appendChild(buildCard(item));
  });

  resultEl.style.display = 'block';

  return analysis.usable.map(s => s.seat).slice(0,4);
}

function run(){
  const raw = roomEl.value.trim().replace(/\s+/g, '');
  if(!/^\d{5}$/.test(raw)){
    msgEl.textContent = '请输入正确的5位数字';
    return;
  }

  msgEl.textContent = '';
  const seats = render(raw);
  pushHistory(raw, seats);
  setTimeout(() => { roomEl.value = ''; roomEl.focus(); }, 180);
}

function loadHist(){
  try{
    return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
  }catch{
    return [];
  }
}

function saveHist(items){
  localStorage.setItem(HISTORY_KEY, JSON.stringify(items.slice(0, HISTORY_LIMIT)));
}

function renderHist(){
  const items = loadHist();
  histListEl.innerHTML = '';

  if(!items.length){
    histListEl.innerHTML = `<div class="histItem"><div class="histMain" style="color:rgba(255,255,255,.2)">暂无记录</div></div>`;
    return;
  }

  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'histItem';
    const res = item.seats.length ? item.seats.map(s=>`${s}号`).join(' / ') : '跳';
    div.innerHTML = `
      <div class="histTop"><span>房号 <span class="pill">${item.room}</span></span><span>${item.time}</span></div>
      <div class="histMain">${item.pattern} → ${res}</div>
    `;
    histListEl.appendChild(div);
  });
}

function pushHistory(room, seats){
  const items = loadHist();
  items.unshift({
    room,
    seats,
    pattern: getParityPattern(room),
    time: new Date().toLocaleString('zh-CN', {hour12:false})
  });
  saveHist(items);
  renderHist();
}

goEl.addEventListener('click', run);
roomEl.addEventListener('keydown', e => { if(e.key === 'Enter') run(); });

clearBtnEl.addEventListener('click', () => {
  localStorage.removeItem(HISTORY_KEY);
  renderHist();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}

renderHist();
roomEl.focus();
</script>
</body>
</html>
